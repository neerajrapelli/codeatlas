name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: codeatlas
          POSTGRES_PASSWORD: codeatlas
          POSTGRES_DB: codeatlas
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U codeatlas -d codeatlas"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache-dependency-path: apps/api/go.sum
      - name: Install build deps (Tree-sitter CGO)
        run: sudo apt-get update && sudo apt-get install -y build-essential pkg-config
      - name: Go test
        working-directory: apps/api
        env:
          DATABASE_URL: postgresql://codeatlas:codeatlas@localhost:5432/codeatlas
          MIGRATIONS_DIR: ./migrations
        run: |
          go test ./... -count=1
          CGO_ENABLED=1 go build -o /tmp/server ./cmd/server

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @codeatlas/web typecheck
      - run: pnpm --filter @codeatlas/web test
      - name: Install Playwright browsers
        run: pnpm exec playwright install chromium --with-deps
        working-directory: apps/web
      - run: pnpm --filter @codeatlas/web test:e2e

  architecture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - name: Build dependency graph artifacts
        run: pnpm arch:dep:json
      - name: Lint ADR format
        run: pnpm arch:adr:lint
      - name: Check dependency cycles
        run: pnpm arch:dep:cycles
      - name: Validate architecture boundaries
        run: pnpm arch:dep:validate
      - name: Build base branch dependency graph
        if: github.event_name == 'pull_request'
        run: |
          git worktree add ../codeatlas-base origin/${{ github.base_ref }}
          cd ../codeatlas-base
          pnpm install --frozen-lockfile
          pnpm arch:dep:json
          cp artifacts/module-graph.json ../codeatlas/artifacts/base-module-graph.json
      - name: Compute architecture diff
        if: github.event_name == 'pull_request'
        run: |
          pnpm arch:dep:diff artifacts/base-module-graph.json artifacts/module-graph.json artifacts/module-graph-diff.json
          pnpm arch:dep:pr-summary
      - name: Cleanup base worktree
        if: always() && github.event_name == 'pull_request'
        run: git worktree remove ../codeatlas-base --force || true
      - name: Append architecture summary to job summary
        if: github.event_name == 'pull_request'
        run: cat artifacts/architecture-pr-summary.md >> $GITHUB_STEP_SUMMARY
      - name: Upload architecture artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: architecture-${{ github.sha }}
          path: artifacts/
          if-no-files-found: warn

  validation-platform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @codeatlas/validation-platform build
      - run: pnpm --filter @codeatlas/validation-platform typecheck
      - run: pnpm --filter @codeatlas/validation-platform test
